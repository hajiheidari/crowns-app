# Launch test: builds the app (Release, same JS as TestFlight) for the iPhone simulator, opens it and prints any crash
# report and the app's log. Free on the public repo's macOS runner; needs no secrets. Runs by hand, or when a pushed
# commit message contains "[sim test]".
name: iOS launch test

on:
  workflow_dispatch:
  push:
    branches: [main, claude/android-app-execution-uzwdw8]

jobs:
  sim:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sim test]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prebuild
        run: npx expo prebuild -p ios --no-install && cd ios && pod install

      - name: Build for the simulator
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Launch (fresh English, fresh Persian, Persian with a saved game like a 1.1.0 player)
        run: |
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[6-9] Pro \(' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          mkdir -p out
          for CASE in en fa fa-saved; do
            echo "=================== $CASE"
            xcrun simctl uninstall "$DEV" com.espadna.tiaro || true
            rm -f ~/Library/Logs/DiagnosticReports/*Tiaro* 2>/dev/null || true
            xcrun simctl install "$DEV" "$APP"
            if [ "$CASE" = fa-saved ]; then
              DATA=$(xcrun simctl get_app_container "$DEV" com.espadna.tiaro data)
              DIR="$DATA/Library/Application Support/com.espadna.tiaro/RCTAsyncLocalStorage_V1"
              mkdir -p "$DIR" && cp .github/sim-seed.json "$DIR/manifest.json"
            fi
            LANG_ARGS=""
            [ "$CASE" != en ] && LANG_ARGS="-AppleLanguages (fa) -AppleLocale fa_IR"
            (xcrun simctl spawn "$DEV" log stream --level debug --predicate 'process == "Tiaro"' > "out/$CASE.log" 2>&1 &)
            xcrun simctl launch "$DEV" com.espadna.tiaro $LANG_ARGS
            sleep 30
            xcrun simctl io "$DEV" screenshot "out/$CASE.png" || true
            if xcrun simctl spawn "$DEV" launchctl list | grep -q 'UIKitApplication:com.espadna.tiaro'; then echo "RUNNING"; else echo "NOT RUNNING (crashed)"; fi
            pkill -f "log stream" || true
            for f in ~/Library/Logs/DiagnosticReports/*Tiaro*; do [ -f "$f" ] && { echo "--- crash report $f"; cp "$f" out/; head -c 20000 "$f"; echo; }; done
            echo "--- JS / error lines"
            grep -E "ReactNativeJS|RCTFatal|Exception|exception|fatal|Fatal|Terminating|abort" "out/$CASE.log" | grep -v "has nothing to cleanup" | tail -60
            xcrun simctl terminate "$DEV" com.espadna.tiaro || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: out/
